name: Build & push images

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: web
            context: ./frontend
          - name: api
            context: ./backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/open-family-finance-${{ matrix.name }}
          tags: |
            # Branch tag (niet voor main)
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}

            # PR tags
            type=ref,event=pr

            # Git release tags
            type=semver,pattern={{version}}

            # Immutable tag
            type=sha,format=short

            # Alleen main krijgt latest
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  # A published release (tag v1.2.3 → images 1.2.3) goes straight to the
  # cluster: the gitops repo pins both images to the new version and Argo CD
  # syncs it. Branch and PR builds don't deploy.
  deploy-release:
    name: Deploy release via gitops
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Image tag from release tag
        id: version
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Repository Dispatch
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.PAT }}
          repository: x-real-ip/gitops
          event-type: update-manifest
          client-payload: >-
            {"ref": "${{ github.ref }}",
            "repository": "${{ github.repository }}",
            "registry": "${{ env.REGISTRY }}",
            "sha": "${{ github.sha }}",
            "tag": "${{ steps.version.outputs.tag }}",
            "images": "${{ env.REGISTRY }}/${{ github.repository_owner }}/open-family-finance-web ${{ env.REGISTRY }}/${{ github.repository_owner }}/open-family-finance-api"}
