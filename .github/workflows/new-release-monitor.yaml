---
name: Check releases

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-releases:
    uses: x-real-ip/github-actions/.github/workflows/new-release-issue.yaml@main
    secrets:
      PAT: ${{ secrets.PAT }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend-node
            type: docker
            target: library/node
            bump: true
            bump_type: containerfile
            containerfile: frontend/Dockerfile
            image: "node"
            include_tags: '^[0-9]*-alpine$'
            exclude_tags: ""
          - name: frontend-nginx
            type: docker
            target: library/nginx
            bump: true
            bump_type: containerfile
            containerfile: frontend/Dockerfile
            image: "nginx"
            include_tags: '^1\.[0-9]*-alpine$'
            exclude_tags: ""
          - name: backend-node
            type: docker
            target: library/node
            bump: true
            bump_type: containerfile
            containerfile: backend/Dockerfile
            image: "node"
            include_tags: '^[0-9]*-alpine$'
            exclude_tags: ""
    with:
      name: ${{ matrix.name }}
      target: ${{ matrix.target }}
      type: ${{ matrix.type }}
      bump: ${{ matrix.bump }}
      bump_type: ${{ matrix.bump_type }}
      containerfile: ${{ matrix.containerfile }}
      image: ${{ matrix.image }}
      include_tags: ${{ matrix.include_tags }}
      exclude_tags: ${{ matrix.exclude_tags }}
