# Full stack locally: database + backend + frontend.
# Copy .env.example to .env first.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # Built from the repository root: the monthly report reuses frontend/src/finance.js.
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      API_TOKEN: ${API_TOKEN}
      PORT: 8080
      PAPERLESS_ENABLED: ${PAPERLESS_ENABLED:-false}
      PAPERLESS_URL: ${PAPERLESS_URL:-}
      PAPERLESS_PUBLIC_URL: ${PAPERLESS_PUBLIC_URL:-}
      PAPERLESS_API_TOKEN: ${PAPERLESS_API_TOKEN:-}
      PAPERLESS_DOCUMENT_TYPE_PRIORITY: ${PAPERLESS_DOCUMENT_TYPE_PRIORITY:-}
      LANGUAGE: ${LANGUAGE:-nl}
      APP_TITLE: ${APP_TITLE:-}
      TZ: ${TZ:-Europe/Amsterdam}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-true}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      BACKEND_URL: http://api:8080
      API_TOKEN: ${API_TOKEN}
      LANGUAGE: ${LANGUAGE:-nl}
      APP_TITLE: ${APP_TITLE:-}
      PAPERLESS_ENABLED: ${PAPERLESS_ENABLED:-false}
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
